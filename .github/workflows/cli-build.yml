name: Build CLI TUI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build mx-tools TUI binary
        working-directory: ./cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          BIN="mx-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w" -o "${BIN}" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mx-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ./cli/mx-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Attach to GitHub Release
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
          files: ./cli/mx-${{ matrix.goos }}-${{ matrix.goarch }}
          fail_on_unmatched_files: true

